<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0D2B5C">
  <meta name="description" content="Controle seguro do abastecimento rural - Água para Todos">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">

  <title>Água para Todos</title>
</head>

<body class="login-active">

  <header class="topbar">
    <div>
      <div class="brand">ÁGUA <span>PARA TODOS</span></div>
      <small>Controle seguro do abastecimento rural • Areia Branca-RN</small>
    </div>

    <button id="logoutBtn" class="ghost hidden">
      Sair
    </button>
  </header>

  <main class="container">

    <section id="loginView" class="card auth-card">

      <div class="auth-header">
        <span class="badge location-badge">Areia Branca - RN</span>
        <h1>Água para Todos</h1>
        <p>
          Entre com seu e-mail ou telefone para registrar ou acompanhar o fornecimento de água.
        </p>
      </div>

      <form id="loginForm">

        <label for="loginEmail">
          E-mail ou Telefone
          <input
            id="loginEmail"
            type="text"
            inputmode="email"
            autocomplete="username"
            placeholder="Ex: 84999998888 ou seu@email.com"
            required
          >
        </label>

        <label for="loginPassword">
          Senha
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
        </label>

        <button
          class="primary btn-login"
          type="submit"
        >
          Entrar no Sistema
        </button>

      </form>

      <div
        id="loginMsg"
        class="message"
      ></div>

    </section>

    <section
      id="appView"
      class="hidden"
    >

      <div class="welcome card">

        <div>

          <strong id="userName">
            Usuário
          </strong>

          <span
            id="userRole"
            class="badge"
          ></span>

        </div>

        <span
          id="connectionStatus"
          class="status"
        >
          Conectando…
        </span>

      </div>

      <div
        id="adminPanel"
        class="hidden"
      ></div>

      <div
        id="driverPanel"
        class="hidden"
      ></div>

      <div
        id="recipientPanel"
        class="hidden"
      ></div>

    </section>

  </main>

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-box">

      <button
        id="closeModal"
        class="close"
        aria-label="Fechar"
      >
        &times;
      </button>

      <div
        id="modalContent"
      ></div>

    </div>

  </div>

  <div
    id="toast"
    class="toast"
  ></div>

  <script type="module" src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((registration) => {
            console.log("Service Worker registrado:", registration.scope);
          })
          .catch((error) => {
            console.error("Erro ao registrar Service Worker:", error);
          });
      });
    }
  </script>

</body>
</html>
