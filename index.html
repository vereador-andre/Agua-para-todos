<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

  <meta name="theme-color" content="#0D2B5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Controle seguro do abastecimento rural - Areia Branca-RN">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">

  <title>Água para Todos - Areia Branca</title>
</head>

<body>

  <header class="topbar">
    <div>
      <div class="brand">ÁGUA <span>PARA TODOS</span></div>
      <small>Areia Branca-RN • Abastecimento Rural</small>
    </div>

    <button id="logoutBtn" class="ghost hidden" type="button">
      Sair
    </button>
  </header>

  <main class="container">

    <!-- Tela de Login com fundo temático -->
    <section id="loginView" class="auth-wrapper">
      <div class="card auth-card">
        <div class="auth-header">
          <span class="location-badge">📍 Areia Branca - RN</span>
          <h1>Água para Todos</h1>
          <p>
            Entre com seus dados para gerenciar ou acompanhar o fornecimento de água.
          </p>
        </div>

        <form id="loginForm">
          <label for="loginIdentifier">
            E-mail ou Telefone
            <input
              id="loginIdentifier"
              type="text"
              inputmode="email"
              autocomplete="username"
              placeholder="Insira seu telefone ou e-mail"
              required
            >
          </label>

          <label for="loginPassword">
            Senha
            <input
              id="loginPassword"
              type="password"
              autocomplete="current-password"
              placeholder="Digite sua senha"
              required
            >
          </label>

          <button class="primary btn-block" type="submit" id="loginSubmitBtn">
            Entrar no Sistema
          </button>
        </form>

        <div id="loginMsg" class="message" role="alert"></div>
      </div>
    </section>

    <!-- Tela Principal do App -->
    <section id="appView" class="hidden">
      <div class="welcome card">
        <div>
          <strong id="userName">Usuário</strong>
          <span id="userRole" class="badge">Acesso</span>
        </div>

        <span id="connectionStatus" class="status">
          Conectando…
        </span>
      </div>

      <!-- Painéis dinâmicos -->
      <div id="adminPanel" class="hidden"></div>
      <div id="driverPanel" class="hidden"></div>
      <div id="recipientPanel" class="hidden"></div>
    </section>

  </main>

  <!-- Janela Modal / Tela Sobreposta Segura para iOS -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modalTitle">Detalhes</h2>
        <button id="closeModal" class="close" type="button" aria-label="Fechar janela">
          ✕
        </button>
      </div>

      <div id="modalContent" class="modal-body"></div>
    </div>
  </div>

  <!-- Notificações Toast -->
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((reg) => console.log("Service Worker pronto:", reg.scope))
          .catch((err) => console.error("Erro no Service Worker:", err));
      });
    }
  </script>

</body>
</html>
