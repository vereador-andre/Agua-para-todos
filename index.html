<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Água para Todos • Controle de Abastecimento</title>
  
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0284c7">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="connectionStatus" class="connection-banner hidden">Verificando rede...</div>

  <!-- TELA DE LOGIN -->
  <div id="loginView" class="view-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-badge">💧</div>
        <h1>Água para Todos</h1>
        <p>Prefeitura Municipal de Areia Branca/RN</p>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Telefone / WhatsApp (Login)</label>
        <input id="loginEmail" type="text" placeholder="Ex: (84) 99999-9999" autocomplete="username" required>

        <label for="loginPassword">Senha de Segurança (6 dígitos)</label>
        <input id="loginPassword" type="password" maxlength="6" placeholder="••••••" autocomplete="current-password" required>

        <button type="submit" id="btnSubmitLogin" class="primary" style="width: 100%; margin-top: 8px;">
          🚀 Acessar o Sistema
        </button>
        <p id="loginMsg" class="error-msg" style="color: var(--danger); font-size: 13px; text-align: center; margin-top: 14px; font-weight: 600;"></p>
      </form>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL (CABEÇALHO TECH) -->
  <div id="appView" class="view-container hidden" style="background: transparent; flex-direction: column; justify-content: flex-start; padding: 0;">
    <header class="app-header" style="width: 100%;">
      <div class="header-brand-title">
        <span>💧</span> Controle de Abastecimento
      </div>

      <div class="user-badge">
        <div class="user-profile-wrapper">
          <div class="user-avatar" id="userAvatar">🛡️</div>
          <div class="user-info">
            <h2 id="userName">Carregando...</h2>
            <span id="userRole" class="pill scheduled" style="font-size: 9px; padding: 2px 6px;">Cargo</span>
          </div>
        </div>
        <button id="logoutBtn" class="logout-btn">🚪 Sair</button>
      </div>
    </header>

    <main class="main-content">
      <section id="adminPanel" class="panel hidden"></section>
      <section id="driverPanel" class="panel hidden"></section>
      <section id="recipientPanel" class="panel hidden"></section>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="closeModal" class="modal-close-btn">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
