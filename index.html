<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Água para Todos • Controle de Abastecimento</title>
  
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0077b6">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="connectionStatus" class="connection-banner hidden">Verificando rede...</div>

  <!-- TELA DE LOGIN -->
  <div id="loginView" class="view-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-badge">🚛💧</div>
        <h1>Água para Todos</h1>
        <p class="subtitle-slogan">Compromisso com a População</p>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Acesso de Usuário</label>
        <input id="loginEmail" type="text" placeholder="E-mail Admin ou Telefone Morador/Motorista" autocomplete="username" required>

        <label for="loginPassword">Senha de Acesso</label>
        <input id="loginPassword" type="password" placeholder="Sua senha ou 6 dígitos" autocomplete="current-password" required>

        <button type="submit" id="btnSubmitLogin" class="primary" style="width: 100%; margin-top: 8px;">
          🚀 Acessar o Sistema
        </button>

        <div style="text-align: right; margin-top: 10px;">
          <a href="#" id="forgotPasswordLink" style="font-size: 12px; color: var(--primary); font-weight: 700; text-decoration: none;">Esqueceu sua senha?</a>
        </div>

        <p id="loginMsg" class="error-msg" style="color: var(--danger); font-size: 13px; text-align: center; margin-top: 14px; font-weight: 600;"></p>
      </form>

      <div class="login-footer-prefeitura">
        Prefeitura Municipal
      </div>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="appView" class="view-container hidden" style="background: transparent; flex-direction: column; justify-content: flex-start; padding: 0;">
    <header class="app-header">
      <div class="header-brand-title">
        <span>🚛💧</span> CONTROLE DE ABASTECIMENTO
      </div>

      <div class="user-badge-central">
        <div class="user-info-inline">
          <span id="userAvatar">🏡</span>
          <h2 id="userName">Carregando...</h2>
          <span id="userRole" class="pill scheduled" style="font-size: 8px; padding: 1px 4px;">Cargo</span>
        </div>
        <button id="logoutBtn" class="logout-btn">🚪 Sair</button>
      </div>
    </header>

    <main class="main-content">
      <section id="adminPanel" class="panel hidden"></section>
      <section id="driverPanel" class="panel hidden"></section>
      <section id="recipientPanel" class="panel hidden"></section>
    </main>
  </div>

  <!-- BOTÃO FLUTUANTE DE SUPORTE WHATSAPP -->
  <a href="https://wa.me/5584999999999?text=Olá,%20preciso%20de%20suporte%20sobre%20o%20sistema%20Água%20para%20Todos." target="_blank" class="whatsapp-float-btn">
    💬 Suporte WhatsApp
  </a>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="closeModal" class="modal-close-btn">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
