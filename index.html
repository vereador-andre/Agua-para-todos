<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#0D2B5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Controle seguro do abastecimento rural - Água para Todos">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">

  <title>Água para Todos - Areia Branca/RN</title>
</head>

<body>

  <!-- Barra do Topo -->
  <header class="topbar">
    <div class="topbar-content">
      <div class="brand">ÁGUA <span>PARA TODOS</span></div>
      <small>Controle Rural • Areia Branca-RN</small>
    </div>

    <button id="logoutBtn" class="btn-logout hidden" type="button">
      Sair
    </button>
  </header>

  <!-- Tela de Login com fundo de Areia Branca -->
  <section id="loginView" class="login-screen">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Areia Branca - RN</span>
        <h1>Água para Todos</h1>
        <p>Acesse com seu e-mail ou telefone cadastrado.</p>
      </div>

      <form id="loginForm" novalidate>
        <label for="loginEmail">
          E-mail ou Telefone (com DDD)
          <input
            id="loginEmail"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Ex: 84999998888 ou seu@email.com"
            required
          >
        </label>

        <label for="loginPassword">
          Senha de Acesso
          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
        </label>

        <button class="primary auth-submit" type="submit">
          Entrar no Sistema
        </button>
      </form>

      <div id="loginMsg" class="message" role="alert"></div>
    </div>
  </section>

  <!-- Área autenticada -->
  <main class="container">
    <section id="appView" class="hidden">
      <div class="welcome card">
        <div class="welcome-user">
          <strong id="userName">Usuário</strong>
          <span id="userRole" class="badge">Carregando perfil...</span>
        </div>
        <span id="connectionStatus" class="status">Conectado</span>
      </div>

      <div id="adminPanel" class="hidden"></div>
      <div id="driverPanel" class="hidden"></div>
      <div id="recipientPanel" class="hidden"></div>
    </section>
  </main>

  <!-- Tela Cheia Dedicada (Modal Nativo Isolado do Fluxo Normal) -->
  <div id="screenModal" class="fullscreen-modal" style="display: none;" role="dialog" aria-modal="true">
    <div class="fullscreen-box">
      <header class="fullscreen-header">
        <h2 id="modalTitle">Detalhes</h2>
        <button id="closeModal" class="fullscreen-close" type="button" aria-label="Fechar tela">
          ✕
        </button>
      </header>

      <div id="modalContent" class="fullscreen-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((registration) => {
            console.log("Service Worker pronto:", registration.scope);
          })
          .catch((error) => {
            console.error("Falha no Service Worker:", error);
          });
      });
    }
  </script>
</body>
</html>
