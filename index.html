<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#0D2B5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Controle seguro do abastecimento rural - Água para Todos">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css?v=99">

  <title>Água para Todos - Areia Branca/RN</title>
</head>

<body>

  <header class="topbar">
    <div class="topbar-content">
      <div class="brand">ÁGUA <span>PARA TODOS</span></div>
      <small>Controle Rural • Areia Branca-RN</small>
    </div>

    <button id="logoutBtn" class="btn-logout hidden" type="button">
      Sair
    </button>
  </header>

  <section id="loginView" class="login-screen">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-badge">Areia Branca - RN</span>
        <h1>Água para Todos</h1>
        <p>Acesse com seu e-mail ou telefone cadastrado.</p>
      </div>

      <form id="loginForm" onsubmit="return false;" novalidate>
        <label for="loginEmail">
          E-mail ou Telefone (com DDD)
          <input
            id="loginEmail"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Insira seu telefone ou e-mail"
            required
          >
        </label>

        <label for="loginPassword">
          Senha de Acesso
          <input
            id="loginPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Digite sua senha"
            required
          >
        </label>

        <button id="btnSubmitLogin" class="primary auth-submit" type="button">
          Entrar no Sistema
        </button>
      </form>

      <div id="loginMsg" class="message" role="alert"></div>
    </div>
  </section>

  <main class="container">
    <section id="appView" class="hidden">
      <div class="welcome card">
        <div class="welcome-user">
          <strong id="userName">Usuário</strong>
          <span id="userRole" class="badge">Carregando...</span>
        </div>
        <span id="connectionStatus" class="status ok">Online</span>
      </div>

      <div id="adminPanel" class="hidden"></div>
      <div id="driverPanel" class="hidden"></div>
      <div id="recipientPanel" class="hidden"></div>
    </section>
  </main>

  <div id="screenModal" class="fullscreen-modal hidden" role="dialog" aria-modal="true">
    <div class="fullscreen-box">
      <header class="fullscreen-header">
        <h2 id="modalTitle">Detalhes</h2>
        <button id="closeModal" class="fullscreen-close" type="button" aria-label="Fechar tela">
          ✕
        </button>
      </header>

      <div id="modalContent" class="fullscreen-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script>
    window.addEventListener("error", function (e) {
      var msgBox = document.getElementById("loginMsg");
      if (msgBox) {
        msgBox.textContent = "Erro no script: " + e.message;
        msgBox.classList.add("visible");
      }
    });
  </script>

  <script type="module" src="./app.js?v=99"></script>
</body>
</html>
